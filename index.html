
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Pixel World</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #111827;
      color: #f9fafb;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    header { padding: 32px 16px 20px; }
    h1 { margin: 0 0 10px; font-size: 36px; }
    header p { color: #cbd5e1; margin: 0; }
    main { max-width: 760px; margin: 0 auto; padding: 16px; }
    .status {
      display: inline-block;
      margin: 12px 0 20px;
      padding: 8px 14px;
      background: #1f2937;
      border-radius: 20px;
      color: #a7f3d0;
      font-size: 14px;
    }
    .board {
      width: 100%;
      aspect-ratio: 1;
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      border: 3px solid #374151;
      border-radius: 4px;
      display: grid;
      place-items: center;
      color: #374151;
      padding: 20px;
    }
    .board p { line-height: 1.7; }
    .palette {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 20px auto;
      max-width: 500px;
    }
    .swatch {
      width: 32px;
      height: 32px;
      border: 2px solid #6b7280;
      border-radius: 6px;
    }
    button {
      cursor: pointer;
      border: 0;
      border-radius: 8px;
      padding: 12px 20px;
      background: #2563eb;
      color: white;
      font-size: 15px;
    }
    footer { padding: 24px; color: #9ca3af; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1>🌍 Pixel World</h1>
    <p>One world. One million pixels. Made by everyone.</p>
    <div class="status">The world is waiting for its first pixel!</div>
  </header>

  <main>
    <div class="board">
      <p>
        <strong>Your shared world starts here.</strong><br>
        1000 × 1000 pixels<br>
        16 colors · One pixel every 60 seconds
      </p>
    </div>

    <div class="palette" aria-label="Pixel color palette">
      <span class="swatch" style="background:#FFFFFF"></span>
      <span class="swatch" style="background:#000000"></span>
      <span class="swatch" style="background:#E5243B"></span>
      <span class="swatch" style="background:#0052A4"></span>
      <span class="swatch" style="background:#F9D616"></span>
      <span class="swatch" style="background:#00843D"></span>
      <span class="swatch" style="background:#FF7900"></span>
      <span class="swatch" style="background:#6A1B9A"></span>
      <span class="swatch" style="background:#009B9B"></span>
      <span class="swatch" style="background:#8B4513"></span>
      <span class="swatch" style="background:#F4A7BB"></span>
      <span class="swatch" style="background:#8C8C8C"></span>
      <span class="swatch" style="background:#7FA9D8"></span>
      <span class="swatch" style="background:#90D65A"></span>
      <span class="swatch" style="background:#B5121B"></span>
      <span class="swatch" style="background:#123B2A"></span>
    </div>

    <button type="button" disabled>Pixel placement coming soon</button>
  </main>

  <footer>Pixel World · A canvas created by everyone</footer>
</body>
</html>
